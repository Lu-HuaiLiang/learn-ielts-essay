<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#141714">
  <meta name="description" content="22 个话题、70 篇雅思作文的滚动精读课程：修订版英文、中文论证链、小修解析、搭配迁移与主动回忆。">
  <title>Essay · 雅思写作精读课程库</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23141714'/%3E%3Cpath d='M20 7C17 13 10 19 10 25a10 10 0 0020 0c0-6-7-12-10-18z' fill='%23d6dfb7'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script defer src="course-model.js"></script>
  <script defer src="course-data.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#teaching">跳到中文教学</a>
  <header class="topbar">
    <div class="brand-area">
      <a class="brand" href="#" id="brand-home" aria-label="从头学习当前课程">
        <svg viewBox="0 0 32 38" width="24" height="29" aria-hidden="true"><path d="M16 2C12 10 3 18 3 25a13 13 0 0026 0c0-7-9-15-13-23Z" fill="currentColor"/><path d="M9 24c0 4 3 7 7 7" fill="none" stroke="#141714" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Essay<span class="brand-dot">.</span></span>
      </a>
      <span class="brand-caption">IELTS WRITING LAB<span>雅思写作精读</span></span>
      <span class="edition" id="collection-count">70 ESSAYS</span>
    </div>
    <div class="course-area">
      <div id="course-tabs" class="course-tabs" aria-label="当前课程"></div>
      <button id="library-toggle" class="library-toggle" aria-label="课程库" aria-expanded="false" aria-controls="library-panel"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 3h5v5H3zM12 3h5v5h-5zM3 12h5v5H3zM12 12h5v5h-5z" stroke="currentColor" stroke-width="1.3"/></svg><span>课程库</span><b id="library-total">70</b></button>
      <button id="outline-toggle" class="outline-toggle" aria-label="课程目录" aria-expanded="false" aria-controls="outline-panel"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7 5h10M7 10h10M7 15h10M3 5h.01M3 10h.01M3 15h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>目录</span></button>
    </div>
  </header>

  <aside class="english-panel" aria-label="英文修订版范文">
    <div class="essay-heading">
      <div><span class="eyebrow light">THE ESSAY <span class="tiny-line"></span> REVISED EDITION</span><h1 id="essay-title"></h1></div>
      <span id="word-count" title="按空格分词，连字符词及缩写计为一词，不计单独标点"></span>
    </div>
    <details class="essay-prompt" id="essay-prompt"><summary><span>WRITING TASK 2</span><span>查看题目 <span class="plus">＋</span></span></summary><p id="essay-question" lang="en"></p><small id="question-note"></small></details>
    <div class="essay-scroll" id="essay-scroll" tabindex="0" aria-label="完整英文范文，可独立滚动阅读">
      <article id="essay" lang="en"></article>
      <div class="essay-end"><span></span> END OF ESSAY <span></span></div>
    </div>
    <div class="essay-footer"><span class="legend"><i></i>当前讲解 <span class="bold-legend">Aa</span>修订内容</span><button id="follow-toggle" aria-pressed="true"><span class="follow-light"></span>同步跟随</button></div>
  </aside>

  <main class="teaching-panel" id="teaching" tabindex="-1" aria-label="中文教学"></main>
  <div class="section-rail" id="section-rail" aria-label="教学进度"></div>
  <nav class="lesson-footer" aria-label="教学步骤导航">
    <button id="previous" class="step-button" aria-label="上一节"><span aria-hidden="true">←</span><span>上一节</span></button>
    <div class="footer-progress"><span id="step-position"></span><div class="progress-track"><div id="progress-fill"></div></div></div>
    <button id="next" class="step-button next" aria-label="下一节"><span>下一节</span><span aria-hidden="true">→</span></button>
  </nav>
  <div class="outline-backdrop" id="outline-backdrop" hidden></div>
  <section class="outline-panel" id="outline-panel" role="dialog" aria-modal="true" aria-labelledby="outline-heading" hidden>
    <div class="outline-heading"><div><span class="eyebrow">COURSE OUTLINE</span><h2 id="outline-heading">课程目录</h2></div><button id="outline-close" aria-label="关闭目录">×</button></div>
    <div id="outline-list"></div>
    <button id="restart" class="restart">↺ <span>从头学习</span></button>
  </section>
  <div class="library-backdrop" id="library-backdrop" hidden></div>
  <section class="library-panel" id="library-panel" role="dialog" aria-modal="true" aria-labelledby="library-heading" hidden>
    <header class="library-heading"><div><span class="eyebrow">IELTS WRITING / THE COLLECTION</span><h2 id="library-heading">精读课程库 <small id="library-subtitle"></small></h2></div><button id="library-close" aria-label="关闭课程库">×</button></header>
    <div class="library-body"><nav id="library-topics" class="library-topics" aria-label="按话题筛选"></nav><div class="library-content"><div class="library-search"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.4"/><path d="m13 13 4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><input id="library-search" type="search" aria-label="搜索课程" placeholder="搜索标题、编号、题型或英文关键词…" autocomplete="off"><button id="library-clear" aria-label="清空搜索" hidden>×</button></div><div class="library-result-heading"><span id="library-result-count" role="status" aria-live="polite"></span><span>英文修订版 · 中文逐段解读</span></div><div id="library-results" class="library-results"></div></div></div>
  </section>
  <noscript><p class="noscript">请启用 JavaScript 以使用课程同步教学与范文阅读功能。</p></noscript>
</body>
</html>
